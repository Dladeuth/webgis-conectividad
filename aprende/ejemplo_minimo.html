<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi primer WebGIS</title>
<!-- 1. Librería Leaflet: estilos y código (desde un CDN gratuito) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { height: 100%; margin: 0; }
  #mapa { height: 100%; }
</style>
</head>
<body>
<div id="mapa"></div>
<script>
// 2. Crear el mapa centrado en el Norte de Bolívar (latitud, longitud) con zoom 9
const mapa = L.map("mapa").setView([10.0, -75.2], 9);

// 3. Mapa base: OpenStreetMap (gratis; la atribución es obligatoria)
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(mapa);

// 4. Una capa vectorial: GeoJSON exportado de QGIS en EPSG:4326
fetch("../data/municipios.geojson")
  .then(r => r.json())
  .then(datos => {
    const capa = L.geoJSON(datos, {
      style: { color: "#555", weight: 1, fillOpacity: 0 },              // simbología
      onEachFeature: (f, l) => l.bindPopup(f.properties.municipio)      // ventana al hacer clic
    }).addTo(mapa);
    mapa.fitBounds(capa.getBounds());                                    // ajustar la vista a la capa
  });

// 5. Una capa de puntos con color según un atributo
fetch("../data/trampolines_nodos.geojson")
  .then(r => r.json())
  .then(datos => {
    const colores = { interior: "#2e7d32", frugivoro: "#df7d12", humedal: "#1f63b3" };
    L.geoJSON(datos, {
      pointToLayer: (f, latlng) => L.circleMarker(latlng, {
        radius: 8, color: "#fff", weight: 2, fillColor: colores[f.properties.gremio], fillOpacity: 1
      }),
      onEachFeature: (f, l) => l.bindPopup(`Trampolín ${f.properties.gremio}, nodo ${f.properties.id_grafo}`)
    }).addTo(mapa);
  });

// 6. Un ráster como imagen: archivo + esquinas [[sur, oeste], [norte, este]]
//    (las esquinas de cada imagen están en data/manifest.json -> "rasters")
fetch("../data/manifest.json")
  .then(r => r.json())
  .then(m => {
    L.imageOverlay("../img/idon_interior_seca.webp", m.rasters["idon_interior_seca"], { opacity: 0.7 }).addTo(mapa);
  });
</script>
</body>
</html>
